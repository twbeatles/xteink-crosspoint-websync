<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{i18n.dashboard.login_title}}</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#313244; padding:28px; border-radius:12px; width:min(400px, 90vw); }
  h1 { color:#89b4fa; font-size:1.2rem; margin-bottom:16px; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid #45475a; background:#181825; color:#cdd6f4; margin:8px 0 16px; }
  button { width:100%; background:#89b4fa; color:#1e1e2e; border:none; border-radius:8px; padding:10px; font-weight:bold; cursor:pointer; }
  #msg { color:#f38ba8; min-height:20px; font-size:0.9rem; }
  p { font-size:0.85rem; color:#a6adc8; }
</style>
</head>
<body>
<div class="card">
  <h1>{{i18n.dashboard.login_heading}}</h1>
  <p>{{i18n.dashboard.login_hint}}</p>
  <input id="token" type="password" placeholder="{{i18n.dashboard.token_placeholder}}" autocomplete="current-password">
  <button onclick="login()">{{i18n.dashboard.login_button}}</button>
  <div id="msg"></div>
</div>
<script>
async function login() {
  const token = document.getElementById('token').value.trim();
  if (!token) { document.getElementById('msg').textContent = '{{i18n.dashboard.token_required}}'; return; }
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({token})
    });
    const d = await r.json();
    if (r.ok) { window.location.href = '/dashboard'; }
    else { document.getElementById('msg').textContent = d.error || '{{i18n.dashboard.login_failed}}'; }
  } catch(e) { document.getElementById('msg').textContent = '{{i18n.dialog.error}}: ' + e; }
}
</script>
</body>
</html>
