<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{i18n.dashboard.title}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; padding: 24px; }
  h1 { color: #89b4fa; font-size: 1.6rem; margin-bottom: 20px; }
  .card { background: #313244; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { color: #89b4fa; font-size: 1rem; margin-bottom: 12px; }
  button { background: #89b4fa; color: #1e1e2e; border: none; border-radius: 8px; padding: 10px 22px; font-size: 0.95rem; cursor: pointer; font-weight: bold; margin-right:8px; }
  button:hover { background: #b4d0fb; }
  #log-area { background: #181825; border-radius: 8px; padding: 14px; font-family: Consolas, monospace; font-size: 0.82rem; height: 220px; overflow-y: auto; white-space: pre-wrap; color: #a6e3a1; margin-top: 10px; }
  #sync-result, #status-area { margin-top: 12px; color: #a6e3a1; min-height: 24px; font-size:0.9rem; }
</style>
</head>
<body>
<h1>{{i18n.dashboard.heading}}</h1>
<div class="card">
  <h2>{{i18n.dashboard.sync_control}}</h2>
  <button id="sync-button" onclick="runSync()">{{i18n.dashboard.run_sync}}</button>
  <button id="cancel-button" onclick="cancelSync()" disabled>{{i18n.dashboard.cancel_sync}}</button>
  <button onclick="refreshStatus()">{{i18n.dashboard.refresh_status}}</button>
  <div id="sync-result"></div>
  <div id="status-area"></div>
</div>
<div class="card">
  <h2>{{i18n.dashboard.logs}}</h2>
  <button onclick="refreshLog()">{{i18n.dashboard.refresh_log}}</button>
  <div id="log-area">{{i18n.dashboard.log_loading}}</div>
</div>
<script>
let refreshing = false;
async function apiFetch(url, opts={}) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 10000);
  try {
    const r = await fetch(url, {credentials: 'same-origin', signal: controller.signal, ...opts});
    if (r.status === 401) { window.location.href = '/'; return null; }
    return r;
  } finally { clearTimeout(timer); }
}
async function controlSync(path) {
  const buttons = [document.getElementById('sync-button'), document.getElementById('cancel-button')];
  buttons.forEach(button => button.disabled = true);
  try {
    const r = await apiFetch(path, {method: 'POST'});
    if (!r) return;
    const d = await r.json();
    document.getElementById('sync-result').textContent = d.message || d.error || '{{i18n.dialog.info}}';
  } catch (error) {
    document.getElementById('sync-result').textContent = '{{i18n.dashboard.request_error}}';
  } finally { await refreshAll(); }
}
async function runSync() { await controlSync('/api/sync'); }
async function cancelSync() { await controlSync('/api/cancel'); }
async function refreshStatus() {
  try {
    const r = await apiFetch('/api/status');
    if (!r) return;
    const d = await r.json();
    document.getElementById('status-area').textContent = JSON.stringify(d, null, 2);
    document.getElementById('sync-button').disabled = !!d.running;
    document.getElementById('cancel-button').disabled = !d.running;
  } catch (error) {
    document.getElementById('status-area').textContent = '{{i18n.dashboard.request_error}}';
    document.getElementById('sync-button').disabled = false;
    document.getElementById('cancel-button').disabled = false;
  }
}
async function refreshLog() {
  try {
    const r = await apiFetch('/api/log');
    if (!r) return;
    const d = await r.json();
    const area = document.getElementById('log-area');
    area.textContent = d.log || '{{i18n.dashboard.no_log}}';
    area.scrollTop = area.scrollHeight;
  } catch (error) {
    document.getElementById('log-area').textContent = '{{i18n.dashboard.request_error}}';
  }
}
async function refreshAll() {
  if (refreshing) return;
  refreshing = true;
  try { await Promise.all([refreshStatus(), refreshLog()]); }
  finally { refreshing = false; }
}
refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
