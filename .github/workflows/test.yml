name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
      - name: Install application and translation test dependencies
        run: python -m pip install -r requirements.txt 'googletrans>=4.0.2,<5'
      - name: Run full suite
        env:
          COVERAGE_FILE: "${{ runner.temp }}/.coverage"
        run: python -m pytest tests/ -q --tb=short -ra -W error::RuntimeWarning

  platform-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run platform and lifecycle contracts
        env:
          COVERAGE_FILE: "${{ runner.temp }}/.coverage"
        run: python -m pytest tests/test_storage_isolation.py tests/test_job_lifecycle.py tests/test_dashboard_request_contract.py tests/test_http_server_lifecycle.py tests/test_cloud_replica_recovery.py tests/test_epub_offline_images.py tests/test_scheduler.py tests/test_calibre.py tests/test_device_path_properties.py tests/test_pipeline_multiprocess_lock.py -q --tb=short -ra
